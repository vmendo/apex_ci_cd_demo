    - # ====== Series: Series 1 ====================================
      id: 9707851132885729
      identification: 
        name: Series 1

      execution: 
        sequence: 10

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select ( select l."ENAME" from "EBA_DEMO_LOAD_EMP" l where l."EMPNO" = c."MGR") "MGR", 
                 count(*) value
            from "EBA_DEMO_LOAD_EMP" c
           group by c."MGR"
           order by 2 desc

      order-by: 
        type: None

      column-mapping: 
        label: MGR
        value: VALUE

      appearance: 
        assigned-to-y2-axis: false

      link: 
        type: Redirect to Page in this Application
        target: 
          url: 'f?p=&APP_ID.:4:&APP_SESSION.::&DEBUG.:RR:IR_MGR:\&MGR.\'
          page: 4 # Load Emp Report
          clear-cache: RR
          values: 
            ir_mgr: '&MGR.'

